# Автоматическая сборка AI_Scalper_Pro.exe на серверах GitHub.
#
# Зачем: .exe весит ~55 МБ, и если класть его в репозиторий, каждая
# пересборка добавляет ещё 55 МБ в историю НАВСЕГДА — git хранит все версии.
# Здесь файл собирается на чистой Windows-машине и прикладывается отдельно:
# история репозитория остаётся лёгкой.
#
# Как забрать готовый .exe:
#   1. Вкладка Actions -> последний запуск -> раздел Artifacts (хранится 90 дней).
#   2. Или создайте тег вида v1.0 — тогда .exe попадёт в Releases навсегда.

name: Сборка AI_Scalper_Pro.exe

on:
  # Кнопка "Run workflow" на вкладке Actions
  workflow_dispatch:
  # Тег вида v1.0 -> сборка попадёт в Releases
  push:
    tags:
      - "v*"

jobs:
  build:
    # PyInstaller не умеет собирать exe для Windows из Linux —
    # нужна именно Windows-машина.
    #
    # Ярлык образа задан ЯВНО (windows-2022), а не windows-latest. Причина
    # живая: сборки 17-20 подряд отменялись ровно через 15 минут, не начав
    # ни одного шага — это признак того, что машина под ярлыком так и не
    # нашлась. Репозиторий открытый, минуты Actions для таких безлимитны,
    # значит дело не в лимите, а в доступности пула. Явный ярлык бьёт в
    # другой пул и заодно избавляет от сюрпризов, когда windows-latest
    # переезжает на новый образ.
    runs-on: windows-2022

    # ПРЕДОХРАНИТЕЛЬ ПО ВРЕМЕНИ. Сборка 49 провисела ШЕСТЬ ЧАСОВ на проверке
    # запуска и была убита GitHub по общему потолку — а владелец всё это
    # время ждал обновления, которого не могло быть. Сборка целиком
    # укладывается в 8-10 минут; сорок минут — это уже «что-то зависло»,
    # и лучше узнать об этом сразу и с понятной причиной.
    timeout-minutes: 40

    # Право записи нужно, чтобы выложить готовый .exe в Releases.
    # Без Releases единственным местом сборки остаются артефакты Actions,
    # а их GitHub отдаёт ТОЛЬКО по токену — даже для открытого
    # репозитория (проверено: список артефактов 200, файл 403). Именно на
    # это упиралось самообновление у владельца.
    permissions:
      contents: write

    # Программа лежит в своей папке — все шаги выполняются оттуда
    defaults:
      run:
        working-directory: ai_scalper_standalone

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Прописать версию в программу
        # Владелец: «прописывай где-то версию, чтобы было видно, обновилось
        # или нет». Номер сборки, короткий номер правки и дата подставляются
        # ПЕРЕД упаковкой — иначе .exe не знал бы о себе ничего, и понять,
        # старая версия запущена или новая, было бы нечем. Сама подстановка
        # живёт в stamp_version.py: у кода в этом файле есть тест, у команд
        # внутри сценария сборки — нет.
        shell: pwsh
        # PYTHONUTF8: консоль Windows на серверах GitHub работает в cp1252, и
        # любая кириллица в выводе роняет шаг с UnicodeEncodeError. Строка
        # version.full() по-русски — печатать её без этого нельзя.
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python stamp_version.py "${{ github.run_number }}" "${{ github.sha }}" (Get-Date -Format "yyyy-MM-dd")
          python -c "import version; print(version.full())"

      - name: Собрать программу ПАПКОЙ (основной способ установки)
        # ПОЧЕМУ ПАПКОЙ, А НЕ ОДНИМ ФАЙЛОМ. Один файл при КАЖДОМ запуске
        # распаковывает во временную папку около 55 МБ. Отсюда три разные
        # ошибки, которые владелец получал подряд: «Can't find a usable
        # init.tcl», «No such file: base_library.zip», «Failed to remove
        # temporary directory» — все три про эту самую распаковку. И она же
        # заставляет антивирус нервничать: распаковать себя во временную
        # папку и запуститься оттуда — обычное поведение вредоносных программ,
        # отличить их снаружи трудно.
        #
        # Папка не распаковывается вовсе: файлы уже лежат рядом. Запуск
        # мгновенный, целого класса ошибок больше нет.
        #
        # --exclude-module config: config.py
        # остаётся обычным файлом рядом с программой, чтобы настройки можно
        # было менять без пересборки.
        #
        # --add-data кладёт ВНУТРЬ .exe исходники советников (.mq5/.mqh).
        # Программа сама копирует их в MetaTrader и вызывает компилятор при
        # первом запуске — отдельные установщики запускать не нужно.
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed
          --name "AI_Scalper_Pro"
          --exclude-module config
          --hidden-import accounts_tab
          --hidden-import accounts
          --hidden-import account_supervisor
          --hidden-import telegram_signals
          --hidden-import telegram_reader
          --hidden-import trading_schedule
          --hidden-import mt5_install
          --hidden-import bridge_host
          --hidden-import diagnostics
          --hidden-import updater
          --hidden-import config_migrate
          --hidden-import cloud_journal
          --hidden-import accounts_backup
          --hidden-import param_help
          --hidden-import version
          --add-data "config.py.example;."
          --add-data "../mql5;mql5"
          --add-data "../ai_scalper_pro;ai_scalper_pro"
          --add-data "../preregistration;preregistration"
          --collect-all telethon
          --collect-all MetaTrader5
          --collect-all anthropic
          --collect-all openai
          --collect-all pystray
          --collect-all certifi
          --collect-all cryptography
          desktop_app.py

      - name: Собрать ОДИН ФАЙЛ (для прежнего самообновления)
        # Уже установленные копии обновляются подменой одного .exe. Убери мы
        # его — самообновление сломалось бы у всех разом, и человеку пришлось
        # бы ставить руками. Поэтому собираем обе версии: папку для установки
        # и один файл для обновления.
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --distpath dist_onefile
          --name "AI_Scalper_Pro"
          --exclude-module config
          --hidden-import accounts_tab
          --hidden-import accounts
          --hidden-import account_supervisor
          --hidden-import telegram_signals
          --hidden-import telegram_reader
          --hidden-import trading_schedule
          --hidden-import mt5_install
          --hidden-import bridge_host
          --hidden-import diagnostics
          --hidden-import updater
          --hidden-import config_migrate
          --hidden-import cloud_journal
          --hidden-import accounts_backup
          --hidden-import param_help
          --hidden-import version
          --add-data "config.py.example;."
          --add-data "../mql5;mql5"
          --add-data "../ai_scalper_pro;ai_scalper_pro"
          --add-data "../preregistration;preregistration"
          --collect-all telethon
          --collect-all MetaTrader5
          --collect-all anthropic
          --collect-all openai
          --collect-all pystray
          --collect-all certifi
          --collect-all cryptography
          desktop_app.py

      - name: Подготовить config.py
        # В репозитории лежит только config.py.example (настоящий содержит
        # ключи и в git не хранится) — установщику нужен обычный config.py
        shell: pwsh
        #
        # РЯДОМ С САМОЙ ПРОГРАММОЙ, а не только в dist. config.py намеренно не
        # встраивается внутрь .exe и ищется в папке программы. При сборке
        # ПАПКОЙ программа лежит в dist\AI_Scalper_Pro\, и config.py в dist\
        # оказывался этажом выше — то есть не там, где программа его ищет.
        # Проверка запуска это и поймала: «No module named 'config'».
        run: |
          if (-not (Test-Path "config.py")) { Copy-Item "config.py.example" "config.py" }
          Copy-Item "config.py" "dist\config.py" -Force
          Copy-Item "config.py" "dist\AI_Scalper_Pro\config.py" -Force
          Copy-Item "config.py" "dist_onefile\config.py" -Force
          # Эталон кладём рядом же: если config.py когда-нибудь пропадёт,
          # программа восстановит его сама вместо падения на импорте.
          Copy-Item "config.py.example" "dist\AI_Scalper_Pro\config.py.example" -Force

      - name: Проверить, что программа ЗАПУСКАЕТСЯ
        # Владелец трижды получал собранную программу, которая не открывалась
        # вовсе: «Can't find a usable init.tcl», «No such file:
        # base_library.zip», «Failed to remove temporary directory». Все три —
        # про распаковку собранного файла, и все три видны при ПЕРВОМ запуске.
        #
        # Значит их надо ловить здесь, а не на компьютере человека. Программа
        # запускается с ключом --selftest: она поднимает окно (самая хрупкая
        # часть) и сразу выходит. Не завелась — сборка неудачная.
        #
        # ЖДАТЬ НАДО СО СРОКОМ, А НЕ ВЕЧНО. Здесь стояло Start-Process -Wait,
        # то есть «ждать сколько угодно». Сборка 49 на этом и застряла: шесть
        # часов на одном шаге, потом GitHub убил её по общему потолку, релиз
        # не вышел, и у владельца просто «нет обновления» без единого
        # объяснения.
        #
        # Причина зависания в том, что программа собрана БЕЗ КОНСОЛИ. Если
        # такая программа спотыкается, Windows показывает окно с ошибкой — а
        # нажать в нём «ОК» на сборочной машине некому, и процесс стоит
        # насмерть. Ровно это ожидание вечности и превращает понятную ошибку
        # в шесть часов тишины.
        #
        # Теперь: ждём три минуты (запуск пустого окна занимает секунды),
        # не дождались — снимаем процесс и пробуем ещё раз, потому что
        # разовые заминки на сборочных машинах случаются. Не помогло —
        # честно валим сборку с внятной причиной.
        shell: pwsh
        run: |
          $ОЖИДАНИЕ_МС = 180000
          $targets = @("dist\AI_Scalper_Pro\AI_Scalper_Pro.exe",
                       "dist_onefile\AI_Scalper_Pro.exe")
          $i = 0
          foreach ($exe in $targets) {
            $i++
            if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
            $ok = $false
            foreach ($попытка in 1..2) {
              $out = "selftest_${i}_$попытка.txt"
              $p = Start-Process -FilePath $exe -ArgumentList "--selftest" `
                                 -PassThru -NoNewWindow `
                                 -RedirectStandardOutput $out
              if (-not $p.WaitForExit($ОЖИДАНИЕ_МС)) {
                Write-Host "Attempt ${попытка}: no exit in $($ОЖИДАНИЕ_МС / 1000)s, killing"
                try { $p.Kill() } catch { }
                Start-Sleep -Seconds 2
                continue
              }
              if (Test-Path $out) { Get-Content $out }
              if ($p.ExitCode -ne 0) {
                throw "Program does not start: $exe (exit code $($p.ExitCode))"
              }
              $ok = $true
              break
            }
            if (-not $ok) {
              throw "Program hangs on startup and never exits: $exe"
            }
            Write-Host "Starts correctly: $exe"
          }

      - name: Проверить, что файл собрался
        shell: pwsh
        run: |
          $single = "dist_onefile\AI_Scalper_Pro.exe"
          if (-not (Test-Path $single)) { throw "Build did not produce $single" }
          $mb = [math]::Round((Get-Item $single).Length / 1MB, 1)
          Write-Host "One-file build: $mb MB"
          if ($mb -lt 5) { throw "One-file build too small ($mb MB)" }
          $folder = "dist\AI_Scalper_Pro"
          $total = [math]::Round((Get-ChildItem $folder -Recurse |
                    Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Folder build: $total MB"
          if ($total -lt 5) { throw "Folder build too small ($total MB)" }

      - name: Собрать установщик AI_Scalper_Setup.exe
        # Inno Setup предустановлен на образах windows-latest.
        # Если его не окажется — не валим сборку: сам .exe уже готов.
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup не найден — установщик пропущен, .exe собран"
            exit 0
          }
          & $iscc "installer.iss"
          if (Test-Path "installer_output\AI_Scalper_Setup.exe") {
            $mb = [math]::Round((Get-Item "installer_output\AI_Scalper_Setup.exe").Length / 1MB, 1)
            Write-Host "Установщик собран: $mb МБ"
          }

      - name: Приложить сборку к запуску
        uses: actions/upload-artifact@v4
        with:
          name: AI_Scalper_Pro-windows
          path: |
            ai_scalper_standalone/installer_output/AI_Scalper_Setup.exe
            ai_scalper_standalone/dist_onefile/AI_Scalper_Pro.exe
            ai_scalper_standalone/dist/config.py
          retention-days: 90
          if-no-files-found: warn

      - name: Опубликовать в Releases
        # Раньше релиз выпускался ТОЛЬКО по тегу v*, а обычный запуск
        # (кнопка «Собрать новую версию» в программе, она же Run workflow)
        # оставлял сборку лежать в артефактах Actions. Скачать её оттуда без
        # токена нельзя, поэтому самообновление у владельца упиралось в
        # «нет доступа к репозиторию», хотя репозиторий открытый. Теперь
        # ЛЮБАЯ сборка попадает в Releases, откуда .exe скачивается обычной
        # ссылкой без всякого токена.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name
                || format('build-{0}', github.run_number) }}
          name: >-
            ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name
                || format('Сборка {0}', github.run_number) }}
          files: |
            ai_scalper_standalone/installer_output/AI_Scalper_Setup.exe
            ai_scalper_standalone/dist_onefile/AI_Scalper_Pro.exe
            ai_scalper_standalone/dist/config.py
          body: |
            Сборка программы AI Scalper Pro для Windows.

            **AI_Scalper_Setup.exe — берите этот.** Установщик: программа
            встанет папкой, с ярлыками в меню «Пуск» и на рабочем столе.
            Запускается мгновенно и не тревожит антивирус.

            **AI_Scalper_Pro.exe** — та же программа одним файлом, без
            установки. Через него работает самообновление уже установленных
            копий. Одному файлу приходится при каждом запуске распаковывать
            себя во временную папку: это медленнее, и именно на этом
            возникали ошибки вида «Can't find a usable init.tcl» и
            «No such file: base_library.zip».

            Python на компьютере не нужен ни в том, ни в другом случае.
