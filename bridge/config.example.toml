# Пример конфигурации моста DualGuard.
# Скопируйте этот файл в config.toml и при необходимости измените.
# Ключ API сюда НЕ вписывается — он хранится в файле .env (см. .env.example).

[server]
host = "127.0.0.1"   # только локальный адрес, наружу не открывать!
port = 8080

[anthropic]
# Имя модели задаётся здесь, а не в коде.
model = "claude-sonnet-5"
max_tokens = 512
timeout_seconds = 30

[cache]
# Сколько минут мост отдаёт закэшированный ответ Claude, не спрашивая заново.
# Советник опрашивает мост раз в 30 минут, поэтому 25 минут значит:
# каждый опрос советника получает свежий или почти свежий ответ.
ttl_minutes = 25

[mock]
# Режим тестирования без ключа API: мост отвечает фиксированным ответом.
enabled = false
regime = "range"            # trend_up | trend_down | range | chaos
trade_allowed = true
risk_multiplier = 0.5
reason = "мок-ответ для тестирования"

[replay]
# Режим воспроизведения: отдавать последние записанные ответы из журнала
# вместо обращения к Claude. Файл — журнал из logs/ (формат JSONL).
enabled = false
file = ""

[symbols]
# Имена символов у ВАШЕГО брокера (если есть суффиксы — укажите их).
eurusd = "EURUSD"
xauusd = "XAUUSD"
# Кандидаты имён для индекса доллара и доходности 10-летних облигаций США.
# Мост переберёт список и возьмёт первый символ, который есть у брокера.
dxy_candidates = ["DXY", "USDX", "DX", "USDIDX", "USIDX", "DXY.cash"]
us10y_candidates = ["US10Y", "UST10Y", "USTN10", "US10YR", "US10Y.cash"]

[calendar]
# Календарь новостей для контекста Claude.
# Библиотека MetaTrader5 для Python не даёт доступ к календарю MT5,
# поэтому используется открытый календарь ForexFactory.
# Если он недоступен, мост честно сообщает Claude, что календаря нет.
# Сам советник фильтрует новости независимо, через встроенный календарь MT5.
enabled = true
url = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"

[logging]
dir = "logs"
